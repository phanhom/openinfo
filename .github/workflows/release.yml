name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Release
        run: swift build -c release --product openinfo

      - name: Package .app
        run: make bundle

      - name: Zip .app
        run: zip -r openinfo.app.zip openinfo.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: openinfo.app.zip
